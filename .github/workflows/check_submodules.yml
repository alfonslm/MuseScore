name: 'Check: Submodules'

on:
  pull_request:
  workflow_dispatch:

jobs:
  check_muse_framework:
    runs-on: ubuntu-slim
    env:
      EXPECTED_URL: https://github.com/musescore/muse_framework.git
      EXPECTED_BRANCH: main
      # NOTE Temporary exception for the "Presets and key triggers" keyswitch-map feature
      # (alfonslm/MuseScore#7): its engine-side change lives in a fork PR
      # (alfonslm/muse_framework#1) pending upstream review, since musescore/muse_framework
      # isn't writable from this account. Remove once that PR merges upstream and this
      # submodule is repointed at EXPECTED_URL/EXPECTED_BRANCH.
      ALLOWED_FORK_URL: https://github.com/alfonslm/muse_framework.git
      ALLOWED_FORK_BRANCH: keyswitch-maps
    steps:
    - name: Clone repository
      uses: actions/checkout@v7

    - name: Verify muse_framework submodule URL
      run: |
        ACTUAL_URL=$(git config -f .gitmodules submodule.muse_framework.url)
        echo "Expected: ${EXPECTED_URL} (or, temporarily, ${ALLOWED_FORK_URL})"
        echo "Actual:   ${ACTUAL_URL}"
        if [ "${ACTUAL_URL}" != "${EXPECTED_URL}" ] && [ "${ACTUAL_URL}" != "${ALLOWED_FORK_URL}" ]; then
          echo "::error file=.gitmodules::muse_framework submodule URL must be ${EXPECTED_URL}, found ${ACTUAL_URL}. Did you accidentally leave it pointing at a fork?"
          exit 1
        fi
        echo "SUBMODULE_URL=${ACTUAL_URL}" >> "$GITHUB_ENV"
        if [ "${ACTUAL_URL}" = "${ALLOWED_FORK_URL}" ]; then
          echo "SUBMODULE_BRANCH=${ALLOWED_FORK_BRANCH}" >> "$GITHUB_ENV"
        else
          echo "SUBMODULE_BRANCH=${EXPECTED_BRANCH}" >> "$GITHUB_ENV"
        fi

    - name: Verify muse_framework commit is in upstream
      run: |
        SHA=$(git ls-tree HEAD muse | awk '{print $3}')
        if [ -z "${SHA}" ]; then
          echo "::error::Could not read muse_framework submodule SHA from index"
          exit 1
        fi
        echo "Pinned commit: ${SHA}"
        TMP=$(mktemp -d)
        git clone --quiet --filter=tree:0 --no-checkout --single-branch --branch "${SUBMODULE_BRANCH}" "${SUBMODULE_URL}" "${TMP}"
        if ! git -C "${TMP}" merge-base --is-ancestor "${SHA}" "origin/${SUBMODULE_BRANCH}"; then
          echo "::error::muse_framework is pinned to ${SHA}, which is not on the ${SUBMODULE_BRANCH} branch of ${SUBMODULE_URL}"
          exit 1
        fi

    - name: Verify muse_framework commit on upstream HEAD
      if: false
      run: |
        SHA=$(git ls-tree HEAD muse | awk '{print $3}')
        if [ -z "${SHA}" ]; then
          echo "::error::Could not read muse_framework submodule SHA from index"
          exit 1
        fi
        echo "Pinned commit: ${SHA}"
        TMP=$(mktemp -d)
        git clone --quiet --filter=tree:0 --no-checkout --single-branch --branch "${EXPECTED_BRANCH}" "${EXPECTED_URL}" "${TMP}"
        UPSTREAM_HEAD=$(git -C "${TMP}" rev-parse origin/${EXPECTED_BRANCH}^{commit})
        echo "Upstream ${EXPECTED_BRANCH} HEAD: ${UPSTREAM_HEAD}"
        if [ "${SHA}" != "${UPSTREAM_HEAD}" ]; then
          echo "::error::muse_framework is pinned to ${SHA}, expected ${UPSTREAM_HEAD} (HEAD of ${EXPECTED_BRANCH} in ${EXPECTED_URL})%0Aplease ensure the submodule is up to date by running \`git submodule update --init --remote ./muse\`"
          exit 1
        fi
