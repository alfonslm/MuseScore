name: 'Sync: upstream-main'

on:
  schedule:
    # 02:00 UTC = 03:00 CET (winter) / 04:00 CEST (summer) - stays in the
    # 3-4am CET/CEST window year-round without needing DST-aware logic.
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.repository == 'alfonslm/MuseScore'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch musescore/MuseScore main and the current upstream-main
        run: |
          git fetch https://github.com/musescore/MuseScore.git main:refs/remotes/upstream-fetch/main
          git fetch origin upstream-main:refs/remotes/origin/upstream-main

      - name: Reset upstream-main to it, unless someone is using the branch
        run: |
          # upstream-main is meant to be a pure mirror. If its current tip isn't
          # an ancestor of upstream's history, something else (a local commit,
          # an in-progress checkout) has been pushed there - leave it alone
          # rather than force-pushing over it.
          if git merge-base --is-ancestor origin/upstream-main upstream-fetch/main; then
            git push origin upstream-fetch/main:refs/heads/upstream-main --force
          else
            echo "::warning::upstream-main has commits not from musescore/MuseScore (someone appears to be using the branch); skipping this sync."
          fi
